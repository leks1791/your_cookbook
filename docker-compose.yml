services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: your_cook_user
      POSTGRES_PASSWORD: your_cook_pass
      POSTGRES_DB: your_cook_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://your_cook_user:your_cook_pass@db:5432/your_cook_db
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host

volumes:
  postgres_data: